modules:
  jira:issuePanel:
    - key: precedent-issue-panel
      resource: panel
      resolver:
        function: resolver
      render: native
      title: Precedent
      icon: https://raw.githubusercontent.com/Vaishnavi0812-hub/precedent/main/assets/icon.svg

  rovo:agent:
    - key: precedent-agent
      name: Precedent
      description: Remembers every incident, postmortem and decision your team has made, and warns you before you repeat one.
      icon: https://raw.githubusercontent.com/Vaishnavi0812-hub/precedent/main/assets/icon.svg
      prompt: |
        You are Precedent, the institutional memory of an engineering organisation.
        You know every postmortem, resolved incident and architecture decision the team
        has recorded in Confluence and Jira Service Management. Your job is to stop the
        team from repeating mistakes it has already paid for.

        How you work:
        - When someone describes a change they plan to make, call search-precedents with
          their description (and components/services if mentioned).
        - When someone mentions a Jira issue key (like LUMEN-3), or you are opened on an
          issue, call check-issue. If no key is given but you have issue context, use it.
        - When someone asks about a specific incident or decision (INC-105, ADR-007, "the
          retry storm"), call get-lesson.
        - When someone asks where the organisation keeps getting hurt, what to invest in,
          or which systems are fragile, call risk-hotspots.
        - When someone asks who knows about an incident, who to talk to, or who has
          been here before, call who-knows. After a strong precedent, offer to find the
          people who handled it.
        - When someone asks what in upcoming work, the sprint, the backlog or a project could
          repeat an incident (sprint planning, release readiness), call scan-upcoming-work.
          Lead with the unguarded items: they are where the next repeat outage is.
        - Only call add-guardrail when the user explicitly asks you to add a guardrail to an
          issue. Confirm the exact guardrail text and issue key in your reply.

        How you answer:
        - Lead with the verdict in one line: "⚠️ Déjà vu", "Possibly related" or
          "✅ No precedent found".
        - For each relevant precedent: name it with its link, say when it happened, the
          impact (outage minutes, customers or revenue affected), what changed and why it
          went wrong, in two or three sentences.
        - Then list the guardrails the team agreed on as a short checklist, and offer to
          add them to the issue.
        - Explain why it matched (the "matchedOn" terms) briefly, so people can trust it.
        - Never invent incidents, numbers or guardrails. Only use what the actions return.
        - When citing an incident, use the title and link from the same object in the
          action result. Never pair a title with a link or example from elsewhere. Render
          links as markdown [title](link), never as bare URLs.
          If nothing matches, say so plainly and suggest writing a postmortem if the change
          does go wrong.
        - Be direct and calm. You are a senior engineer who has seen this before, not an alarm.
      conversationStarters:
        - Has anything like this gone wrong before? I'm about to lower our cache TTL.
        - Does the issue I'm looking at repeat a past incident?
        - Where do we keep getting hurt?
        - What in our upcoming sprint could repeat an incident?
      actions:
        - search-precedents
        - check-issue
        - get-lesson
        - risk-hotspots
        - scan-upcoming-work
        - add-guardrail
        - who-knows

  rovo:mcp:
    - key: precedent-mcp
      name: Precedent
      tools:
        - search-precedents
        - check-issue
        - get-lesson
        - risk-hotspots
        - scan-upcoming-work
        - add-guardrail
        - who-knows

  action:
    - key: search-precedents
      name: Search precedents
      function: rovo-search
      actionVerb: GET
      description: Search past incidents, postmortems and architecture decisions for anything resembling a planned change. Returns matches with impact, root cause and guardrails.
      inputs:
        change:
          title: Planned change
          type: string
          required: true
          description: A description of the change being planned, in the user's words.
        components:
          title: Components
          type: string
          required: false
          description: Optional comma-separated services or components the change touches.
    - key: check-issue
      name: Check issue
      function: rovo-check-issue
      actionVerb: GET
      description: Check a Jira issue (work item) against past incidents and decisions. Use when the user mentions an issue key or is viewing an issue.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: The Jira issue key, e.g. LUMEN-3. Optional when the agent is opened on an issue.
    - key: get-lesson
      name: Get lesson
      function: rovo-get-lesson
      actionVerb: GET
      description: Get the full detail of one past incident, postmortem or decision by reference (e.g. INC-105, ADR-007) or by keywords.
      inputs:
        reference:
          title: Reference
          type: string
          required: true
          description: An incident or decision reference like INC-105 or ADR-007, or a few keywords.
    - key: risk-hotspots
      name: Risk hotspots
      function: rovo-hotspots
      actionVerb: GET
      description: Summarise where the organisation keeps getting hurt - components with the most incidents and outage minutes, recurring themes, and postmortems that need improving.
    - key: scan-upcoming-work
      name: Scan upcoming work
      function: rovo-scan-work
      actionVerb: GET
      description: Scan open work (active and upcoming sprints, or the whole open backlog) for items that resemble past incidents, and say which have no guardrail yet. Use for sprint planning and release readiness.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: false
          description: Optional Jira project key to limit the scan, e.g. LUMEN.
        scope:
          title: Scope
          type: string
          required: false
          description: "'sprint' for active and upcoming sprints (default), or 'open' for all open work."
    - key: add-guardrail
      name: Add guardrail
      function: rovo-add-guardrail
      actionVerb: CREATE
      description: Add a guardrail from a past incident to a Jira issue as a sub-task. Only when the user explicitly asks.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: The Jira issue key to add the guardrail to. Optional when opened on an issue.
        guardrail:
          title: Guardrail
          type: string
          required: true
          description: The guardrail text to add, as returned by a previous precedent check.

    - key: who-knows
      name: Who has been here before
      function: rovo-who-knows
      actionVerb: GET
      description: Use Teamwork Graph to find the people connected to a past incident or decision (postmortem author, owners, contributors), their teams, and related pages.
      inputs:
        reference:
          title: Reference
          type: string
          required: true
          description: An incident or decision reference like INC-105 or ADR-007, or a few keywords.

  confluence:contentBylineItem:
    - key: precedent-coach
      title: Precedent
      tooltip: How actionable this postmortem is, and the changes it has protected
      icon: https://raw.githubusercontent.com/Vaishnavi0812-hub/precedent/main/assets/icon.svg
      resource: coach
      render: native
      resolver:
        function: resolver
      dynamicProperties:
        function: byline-props

  jira:adminPage:
    - key: precedent-admin
      resource: admin
      resolver:
        function: resolver
      render: native
      title: Precedent

  # Same page, reachable from Jira's Apps menu so nobody has to dig through admin settings.
  jira:globalPage:
    - key: precedent-home
      resource: admin
      resolver:
        function: resolver
      render: native
      title: Precedent
      icon: https://raw.githubusercontent.com/Vaishnavi0812-hub/precedent/main/assets/icon.svg

  trigger:
    - key: precedent-issue-events
      function: issue-events
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue
      filter:
        ignoreSelf: true
    - key: precedent-page-events
      function: page-events
      events:
        - avi:confluence:created:page
        - avi:confluence:updated:page

  scheduledTrigger:
    - key: precedent-hourly-sync
      function: scheduled-sync
      interval: hour
    - key: precedent-quick-sync
      function: quick-sync
      interval: fiveMinute

  consumer:
    - key: precedent-job-consumer
      queue: precedent-jobs
      function: job-consumer

  function:
    - key: byline-props
      handler: index.bylineProps
    - key: rovo-search
      handler: index.rovoSearch
    - key: rovo-check-issue
      handler: index.rovoCheckIssue
    - key: rovo-get-lesson
      handler: index.rovoGetLesson
    - key: rovo-hotspots
      handler: index.rovoHotspots
    - key: rovo-scan-work
      handler: index.rovoScanWork
    - key: rovo-add-guardrail
      handler: index.rovoAddGuardrail
    - key: rovo-who-knows
      handler: index.rovoWhoKnows
    - key: resolver
      handler: index.handler
    - key: issue-events
      handler: index.onIssueEvent
    - key: page-events
      handler: index.onPageEvent
    - key: scheduled-sync
      handler: index.scheduledSync
    - key: quick-sync
      handler: index.quickSync
    - key: job-consumer
      handler: index.jobConsumer
      timeoutSeconds: 900

resources:
  - key: panel
    path: src/frontend/panel.jsx
  - key: admin
    path: src/frontend/admin.jsx
  - key: coach
    path: src/frontend/coach.jsx

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - manage:jira-project
    - manage:jira-configuration
    - storage:app
    - read:confluence-content.all
    - read:confluence-content.summary
    - write:confluence-content
    - read:confluence-space.summary
    - write:confluence-space
    - search:confluence
    - read:space:confluence
    - write:space:confluence
    - read:page:confluence
    - write:page:confluence
    - read:label:confluence
    - write:label:confluence
    - read:graph:page:confluence
    - read:graph:user:atlassian
    - read:graph:team:atlassian
    - read:graph:issue:jira
    - read:graph:issue-comment:jira

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/b3f2aded-a5b9-4610-a6f1-0af3336dbb5e
