modules:
  bitbucket:repoPullRequestOverviewPanel:
    - key: precedent-pr-panel
      title: Precedent
      resource: pr-panel
      render: native
      resolver:
        function: resolver

  bitbucket:mergeCheck:
    - key: precedent-merge-check
      name: Precedent - repeat-incident check
      description: Flags pull requests that repeat a past incident until its guardrails are acknowledged.
      function: merge-check
      triggers:
        - on-code-pushed
        - on-merge

  bitbucket:workspaceSettingsMenuPage:
    - key: precedent-settings
      title: Precedent
      resource: settings
      render: native
      resolver:
        function: resolver

  scheduledTrigger:
    - key: precedent-bb-sync
      function: scheduled-sync
      interval: hour

  function:
    - key: resolver
      handler: index.handler
    - key: merge-check
      handler: index.mergeCheck
    - key: scheduled-sync
      handler: index.scheduledSync

resources:
  - key: pr-panel
    path: src/frontend/panel.jsx
  - key: settings
    path: src/frontend/settings.jsx

permissions:
  scopes:
    - read:pullrequest:bitbucket
    - read:repository:bitbucket
    - storage:app
  external:
    fetch:
      backend:
        - "*.atlassian.net"

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/11111111-1111-4111-8111-111111111111
